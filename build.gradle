plugins {
    id 'com.finpay.spring-conventions'
    id 'com.finpay.testing-conventions'
}

description = 'FinPay ledger-service.'

// Services are bootable applications.
bootJar {
    enabled = true
}
jar {
    enabled = true
}

dependencies {
    implementation libs.spring.boot.starter.web
    implementation libs.common.web

    // Shared architecture-rule checks (ArchUnit) enforced against the domain.
    testImplementation libs.common.test
}
